<svg xmlns="http://www.w3.org/2000/svg" width="850" height="200" viewBox="0 0 850 200" role="img" aria-label="connect">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="850" height="200" rx="16"></rect></clipPath>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#0d1930" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.3"></stop>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6fd0"></stop>
      <stop offset="55%" stop-color="#14355e"></stop>
      <stop offset="100%" stop-color="#0f2440"></stop>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="850" height="200" fill="#060b16"></rect>
    <rect x="0" y="0" width="850" height="200" fill="url(#grid)" opacity="0.6"></rect>
    <ellipse cx="430" cy="200" rx="340" ry="150" fill="url(#glow)">
      
    </ellipse>

    <rect x="34" y="30" width="6" height="14" fill="#3b82f6"></rect>
    <text x="50" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="2.4" fill="#58a6ff">CONNECT</text>
    <line x1="168" y1="38" x2="816" y2="38" stroke="#12203a" stroke-width="1" stroke-dasharray="648" stroke-dashoffset="0">
      
    </line>

    <text x="34" y="82" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f0f6fc">Let's talk about software, products, SaaS, AI or interesting ideas.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa7b5" text-anchor="middle">
      <rect x="34" y="104" width="150" height="28" rx="6" fill="#0a1424" stroke="#17304f"></rect><text x="109" y="122">gabrielfbraga.dev</text>
      <rect x="194" y="104" width="239" height="28" rx="6" fill="#0a1424" stroke="#17304f"></rect><text x="313.5" y="122">linkedin.com/in/gabrielfbraga</text>
      <rect x="443" y="104" width="202" height="28" rx="6" fill="#0a1424" stroke="#17304f"></rect><text x="544" y="122">github.com/gaabrielbraga</text>
    </g>

    <rect x="34" y="156" width="3" height="14" fill="#3b82f6"></rect>
    <text x="50" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#58a6ff">Build things. Ship them. Learn. Repeat.</text>
    <rect x="362" y="157" width="7" height="13" fill="#58a6ff">
      
    </rect>
  </g>
  <rect x="1" y="1" width="848" height="198" rx="16" fill="none" stroke="url(#edge)" stroke-width="2"></rect>
</svg>