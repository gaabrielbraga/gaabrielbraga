      <rect x="402" y="88" width="105" height="28" rx="6" fill="#10233d" stroke="#254f85"></rect><text x="454.5" y="106">PostgreSQL</text>
      <rect x="516" y="88" width="73" height="28" rx="6" fill="#10233d" stroke="#254f85"></rect><text x="552.5" y="106">Docker</text>
