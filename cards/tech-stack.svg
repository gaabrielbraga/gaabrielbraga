<svg xmlns="http://www.w3.org/2000/svg" width="850" height="290" viewBox="0 0 850 290" role="img" aria-label="tech stack">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="850" height="290" rx="16"></rect></clipPath>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#0d1930" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.26"></stop>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6fd0"></stop>
      <stop offset="55%" stop-color="#14355e"></stop>
      <stop offset="100%" stop-color="#0f2440"></stop>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="850" height="290" fill="#060b16"></rect>
    <rect x="0" y="0" width="850" height="290" fill="url(#grid)" opacity="0.6"></rect>
    <ellipse cx="120" cy="60" rx="300" ry="180" fill="url(#glow)">
      
    </ellipse>

    <rect x="34" y="30" width="6" height="14" fill="#3b82f6"></rect>
    <text x="50" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="2.4" fill="#58a6ff">TECH-STACK</text>
    <line x1="196" y1="38" x2="816" y2="38" stroke="#12203a" stroke-width="1" stroke-dasharray="620" stroke-dashoffset="0">
      
    </line>

    <text x="34" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2.6" fill="#5c6b7a">CORE</text>
    <line x1="86" y1="72" x2="646" y2="72" stroke="#0f1c31" stroke-width="1"></line>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#79b8ff" text-anchor="middle">
