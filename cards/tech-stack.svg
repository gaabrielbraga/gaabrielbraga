      <rect x="136" y="168" width="50" height="24" rx="5" fill="#0a1424" stroke="#16253f"></rect><text x="161" y="184">Java</text>
      <rect x="194" y="168" width="64" height="24" rx="5" fill="#0a1424" stroke="#16253f"></rect><text x="226" y="184">Python</text>
