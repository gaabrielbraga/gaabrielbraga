    <rect x="34" y="262" width="6" height="6" fill="#3b82f6"></rect>
    <text x="50" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5c6b7a">Focused stack &gt; badge collection.</text>
