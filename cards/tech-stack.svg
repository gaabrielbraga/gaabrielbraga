      <rect x="541" y="168" width="57" height="24" rx="5" fill="#0a1424" stroke="#16253f"></rect><text x="569.5" y="184">Redis</text>

      <rect x="34" y="200" width="79" height="24" rx="5" fill="#0a1424" stroke="#16253f"></rect><text x="73.5" y="216">Tailwind</text>
      <rect x="121" y="200" width="64" height="24" rx="5" fill="#0a1424" stroke="#16253f"></rect><text x="153" y="216">Vercel</text>
      <rect x="193" y="200" width="42" height="24" rx="5" fill="#0a1424" stroke="#16253f"></rect><text x="214" y="216">Git</text>
      <rect x="243" y="200" width="124" height="24" rx="5" fill="#0a1424" stroke="#16253f"></rect><text x="305" y="216">GitHub Actions</text>
